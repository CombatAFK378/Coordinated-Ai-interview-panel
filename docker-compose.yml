# One command to build and run the media worker in its Linux container.
# Secrets come from your local .env (see .env.example). Open http://localhost:8080
#
# Code is mounted as volumes + uvicorn --reload, so editing Python files takes
# effect without rebuilding the image (only requirements changes need a rebuild).
name: interviewer-livekit

services:
  media-worker:
    build:
      context: .
      dockerfile: media-worker/Dockerfile
    image: interviewer-livekit:local
    init: true
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
    volumes:
      # .env is MOUNTED (not baked via env_file), so the app reads current values
      # at startup. Change .env then `docker compose restart` (or up) — no
      # --force-recreate needed, because nothing is copied into the container's
      # environment at create time.
      - ./.env:/app/.env:ro
      # Backend code is mounted for --reload. The frontend is NOT mounted: it's
      # built into the image (dist/). For live frontend dev run `cd web && npm run
      # dev` (Vite :5173 proxies the API to this worker).
      - ./media-worker:/app/media-worker
      - ./shared:/app/shared
      # Persisted interviews (Phase 8): recruiter dashboard reads/writes here.
      - ./data:/app/data
    # Watch both mounted code dirs so edits to shared/ hot-reload too (default
    # --reload only watches the app dir, /app/media-worker). An open browser events
    # socket would otherwise stall a reload on "Waiting for background tasks", so
    # graceful shutdown is capped at 3s.
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload --reload-dir /app/media-worker --reload-dir /app/shared --timeout-graceful-shutdown 3

  # Public HTTPS tunnel for Ask the Panel on WhatsApp: Twilio posts incoming
  # messages to https://$NGROK_DOMAIN/whatsapp/webhook. The app serves ONLY that
  # path through the tunnel (everything else 404s). Needs NGROK_AUTHTOKEN and
  # NGROK_DOMAIN in .env; without them this service exits and the rest runs as normal.
  ngrok:
    image: ngrok/ngrok:3.39.13-alpine
    command: http media-worker:8080 --url=https://${NGROK_DOMAIN:-} --log=stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - media-worker
